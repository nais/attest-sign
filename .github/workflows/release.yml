name: Release and Deploy Attest Sign Integration Test

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run in dry-run mode? Runs in dry-run mode by default."
        required: false
        type: string
        default: 'true'
      major:
        type: string
        required: false
        description: "Major version number to use for the release tag."
        default: "2"

concurrency:
  group: attest-sign-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build container and push to GAR
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # ratchet:actions/checkout@v7.0.0

      - name: Compute next release & deployment tags
        id: tags
        env:
          REQUESTED_MAJOR: ${{ inputs.major || '2' }}
        run: |
          set -e

          git fetch --tags --force

          requested_major="${REQUESTED_MAJOR}"
          latest_tag=$(git tag -l "v${requested_major}.*" | sort -V | tail -n 1 || echo "")

          if [ -z "$latest_tag" ]; then
            major="$requested_major"
            minor=0
            patch=0
          else
            major=$(echo "$latest_tag" | cut -d'.' -f1 | sed 's/v//')
            minor=$(echo "$latest_tag" | cut -d'.' -f2)
            patch=$(echo "$latest_tag" | cut -d'.' -f3)
          fi

          new_patch=$((patch + 1))
          new_tag="v${major}.${minor}.${new_patch}"

          timestamp=$(date -u +"%Y%m%d-%H%M%S")
          deploy_tag="${new_tag}-${timestamp}"

          echo "Computed release tag: $new_tag"
          echo "Computed deploy tag:  $deploy_tag"

          echo "new_tag=${new_tag}" >> "$GITHUB_OUTPUT"
          echo "deploy_tag=${deploy_tag}" >> "$GITHUB_OUTPUT"

      - name: Create Release Tag
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run || 'true' }}
        run: |
          set -e
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          new_tag="${{ steps.tags.outputs.new_tag }}"

          git tag -a "$new_tag" -m "Release $new_tag"

          if [ "$DRY_RUN" = "false" ]; then
            echo "Pushing release tag $new_tag"
            git push origin "$new_tag"
          else
            echo "Dry run enabled, skipping tag push."
          fi

      - name: Push docker image to GAR
        id: docker_build_push
        uses: nais/docker-build-push@31c3a7321909bcb20799fdf46153fec721fd9512 # ratchet:nais/docker-build-push@v0
        with:
          team: nais-verification
          tag: ${{ steps.tags.outputs.deploy_tag }}
          salsa: 'false'
          docker_context: 'test'

      - name: Attest and sign test image
        uses: './'
        with:
          image_ref: ${{ steps.docker_build_push.outputs.image }}

      - name: Deploy attest-sign-integration-test to NAIS
        uses: nais/deploy/actions/deploy@fc3eae3edebabdf67f7592102ae16176d5ba3b5f # ratchet:nais/deploy/actions/deploy@v2
        env:
          CLUSTER: dev-gcp
          RESOURCE: test/nais.yml
          VAR: image=${{ steps.docker_build_push.outputs.image }},name=attest-sign-integration-test

      - name: Update Floating major tag
        if: ${{ success() && (inputs.dry_run || 'true') == 'false' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUESTED_MAJOR: ${{ inputs.major || '2' }}
        run: |
          set -e
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git fetch --tags --force

          major="${REQUESTED_MAJOR}"
          new_tag="${{ steps.tags.outputs.new_tag }}"

          echo "Updating floating tag 'v${major}' → $new_tag"
          git tag -f "v${major}" "$new_tag"
          git push origin -f "v${major}"
