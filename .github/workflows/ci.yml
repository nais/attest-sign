name: CI for Attest Sign

on:
  push:
    branches:
      - '**'

concurrency:
  group: attest-sign-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build image and run action
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      image_ref: ${{ steps.image_ref.outputs.image_ref }}
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1

      - name: Compute CI image tag
        id: tags
        env:
          REF_NAME: ${{ github.head_ref || github.ref_name }}
        run: |
          set -e

          safe_ref=$(printf '%s' "$REF_NAME" | tr '/[:upper:]' '-[:lower:]' | tr -cd 'a-z0-9._-')
          image_tag="ci-${safe_ref}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          echo "image_tag=${image_tag}" >> "$GITHUB_OUTPUT"

      - name: Push docker image to GAR
        id: docker_build_push
        uses: nais/docker-build-push@8e41f1f58749b9248e376c25d33bfbdd2b1163c0 # ratchet:nais/docker-build-push@v0
        with:
          team: nais-verification
          tag: ${{ steps.tags.outputs.image_tag }}
          salsa: 'false'
          docker_context: 'test'

      - name: Attest and sign test image
        id: attest_sign
        uses: './'
        with:
          image_ref: ${{ steps.docker_build_push.outputs.image }}
          sbom: auto-generate-for-me-please.json
          additional_sboms: |
            test/npm-sbom.json

      - name: Verify merged SBOM output
        env:
          FINAL_SBOM: ${{ steps.attest_sign.outputs.sbom }}
        run: |
          set -e

          sbom="$FINAL_SBOM"
          test -f "$sbom"

          jq -e '.components[] | select(.name == "npm-lib" and .version == "1.2.3")' "$sbom" >/dev/null

          component_count=$(jq '.components | length' "$sbom")
          if [ "$component_count" -le 1 ]; then
            echo "Expected merged SBOM to contain both image and npm components, got $component_count component(s)."
            exit 1
          fi

      - name: Export image ref
        id: image_ref
        run: |
          echo "image_ref=${{ steps.docker_build_push.outputs.image }}" >> "$GITHUB_OUTPUT"

  validate-syft:
    name: Build image and run action (Syft SBOM)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      image_ref: ${{ steps.image_ref.outputs.image_ref }}
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1

      - name: Compute CI image tag
        id: tags
        env:
          REF_NAME: ${{ github.head_ref || github.ref_name }}
        run: |
          set -e

          safe_ref=$(printf '%s' "$REF_NAME" | tr '/[:upper:]' '-[:lower:]' | tr -cd 'a-z0-9._-')
          image_tag="ci-${safe_ref}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          echo "image_tag=${image_tag}" >> "$GITHUB_OUTPUT"

      - name: Push docker image to GAR
        id: docker_build_push
        uses: nais/docker-build-push@8e41f1f58749b9248e376c25d33bfbdd2b1163c0 # ratchet:nais/docker-build-push@v0
        with:
          team: nais-verification
          tag: ${{ steps.tags.outputs.image_tag }}
          # separate image: test/Dockerfile is deterministic, same digest as the validate job
          image_suffix: syft
          salsa: 'false'
          docker_context: 'test'

      - name: Attest and sign test image with Syft SBOM
        id: attest_sign
        uses: './'
        with:
          image_ref: ${{ steps.docker_build_push.outputs.image }}
          sbom_generator: syft
          additional_sboms: |
            test/npm-sbom.json

      - name: Verify merged SBOM output
        env:
          FINAL_SBOM: ${{ steps.attest_sign.outputs.sbom }}
        run: |
          set -e

          sbom="$FINAL_SBOM"
          test -f "$sbom"

          jq -e '.bomFormat == "CycloneDX"' "$sbom" >/dev/null
          jq -e '.components[] | select(.name == "npm-lib" and .version == "1.2.3")' "$sbom" >/dev/null

          component_count=$(jq '.components | length' "$sbom")
          if [ "$component_count" -le 1 ]; then
            echo "Expected merged SBOM to contain both image and npm components, got $component_count component(s)."
            exit 1
          fi

      - name: Export image ref
        id: image_ref
        run: |
          echo "image_ref=${{ steps.docker_build_push.outputs.image }}" >> "$GITHUB_OUTPUT"

  lint-sbom:
    name: SBOM lint script
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1

      - name: Clean SBOM passes lint
        run: ./scripts/lint-sbom.sh test/npm-sbom.json error

      - name: Bad SBOM fails lint in error mode
        run: |
          if ./scripts/lint-sbom.sh test/bad-sbom.json error; then
            echo "expected lint-sbom.sh to fail on test/bad-sbom.json"
            exit 1
          fi
          echo "lint-sbom.sh correctly rejected the bad SBOM"

      - name: Bad SBOM only warns in warn mode
        run: ./scripts/lint-sbom.sh test/bad-sbom.json warn

  deploy-preview:
    name: Deploy preview job to dev
    if: ${{ github.event_name == 'push' && github.ref != 'refs/heads/main' }}
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1

      - name: Compute preview job name
        id: preview
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -e

          safe_ref=$(printf '%s' "$REF_NAME" | tr '/[:upper:]' '-[:lower:]' | tr -cd 'a-z0-9-')
          safe_ref=${safe_ref#-}
          safe_ref=${safe_ref%-}
          safe_ref=${safe_ref:0:35}
          name="attest-sign-${safe_ref}-it"

          echo "name=${name}" >> "$GITHUB_OUTPUT"

      - name: Deploy preview to NAIS
        uses: nais/deploy/actions/deploy@849e900e3cfa7faf7ad1532bb3a3e6499c932199 # ratchet:nais/deploy/actions/deploy@v2
        env:
          CLUSTER: dev-gcp
          RESOURCE: test/nais.yml
          VAR: image=${{ needs.validate.outputs.image_ref }},name=${{ steps.preview.outputs.name }}

  deploy-preview-syft:
    name: Deploy Syft preview job to dev
    if: ${{ github.event_name == 'push' && github.ref != 'refs/heads/main' }}
    needs: validate-syft
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1

      - name: Compute preview job name
        id: preview
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -e

          safe_ref=$(printf '%s' "$REF_NAME" | tr '/[:upper:]' '-[:lower:]' | tr -cd 'a-z0-9-')
          safe_ref=${safe_ref#-}
          safe_ref=${safe_ref%-}
          safe_ref=${safe_ref:0:33}
          name="attest-sign-${safe_ref}-syft"

          echo "name=${name}" >> "$GITHUB_OUTPUT"

      - name: Deploy preview to NAIS
        uses: nais/deploy/actions/deploy@849e900e3cfa7faf7ad1532bb3a3e6499c932199 # ratchet:nais/deploy/actions/deploy@v2
        env:
          CLUSTER: dev-gcp
          RESOURCE: test/nais.yml
          VAR: image=${{ needs.validate-syft.outputs.image_ref }},name=${{ steps.preview.outputs.name }}
