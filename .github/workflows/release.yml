name: Release and Deploy Attest Sign Integration Test

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run in dry-run mode? Runs in dry-run mode by default."
        required: false
        type: string
        default: 'true'
      release_line:
        description: "Major release line to update, for example 2 for v2."
        required: true
        type: string
        default: "2"
      release_type:
        description: "Version to publish: patch/minor increment the selected line; major creates its vX.0.0."
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

concurrency:
  group: attest-sign-${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && (inputs.release_line || '2') || (github.event.pull_request.number || github.ref) }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  test:
    name: Build container and push to GAR
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1

      - name: Reconcile floating major tag
        id: reconcile
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.dry_run || 'true') == 'false' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_LINE: ${{ inputs.release_line || '2' }}
        run: |
          set -e

          git fetch --tags --force

          if ! [[ "$RELEASE_LINE" =~ ^(0|[1-9][0-9]*)$ ]]; then
            echo "::error::release_line must be a non-negative integer with no leading zeros"
            exit 1
          fi

          latest_tag=$(git tag -l "v${RELEASE_LINE}.*.*" \
            | grep -E "^v${RELEASE_LINE}\.[0-9]+\.[0-9]+$" \
            | sort -V \
            | tail -n 1 || true)

          major_tag="v${RELEASE_LINE}"

          if [ -z "$latest_tag" ]; then
            echo "repaired=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          current="$(git rev-parse "refs/tags/${major_tag}^{commit}" 2>/dev/null || echo "")"
          target="$(git rev-parse "refs/tags/${latest_tag}^{commit}")"

          if [ "$current" = "$target" ]; then
            echo "repaired=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Floating tag '$major_tag' does not match latest release '$latest_tag'; repairing"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git tag -f "$major_tag" "$target"
          git push origin -f "$major_tag"
          echo "repaired=true" >> "$GITHUB_OUTPUT"

      - name: Compute next release & deployment tags
        id: tags
        env:
          RELEASE_LINE: ${{ inputs.release_line || '2' }}
          RELEASE_TYPE: ${{ inputs.release_type || 'patch' }}
          IS_PUSH_TRIGGER: ${{ github.event_name == 'push' }}
        run: |
          set -e

          git fetch --tags --force

          if ! [[ "$RELEASE_LINE" =~ ^(0|[1-9][0-9]*)$ ]]; then
            echo "::error::release_line must be a non-negative integer with no leading zeros"
            exit 1
          fi

          latest_tag=$(git tag -l "v${RELEASE_LINE}.*.*" \
            | grep -E "^v${RELEASE_LINE}\.[0-9]+\.[0-9]+$" \
            | sort -V \
            | tail -n 1 || true)

          major="$RELEASE_LINE"

          if [ -z "$latest_tag" ] && [ "$RELEASE_TYPE" != "major" ] && [ "$IS_PUSH_TRIGGER" != "true" ]; then
            echo "::error::No releases found on v${RELEASE_LINE}; use release_type: major to bootstrap this line"
            exit 1
          fi

          case "$RELEASE_TYPE" in
            patch)
              if [ -n "$latest_tag" ]; then
                minor=$(echo "$latest_tag" | cut -d'.' -f2)
                patch=$(echo "$latest_tag" | cut -d'.' -f3)
                patch=$((patch + 1))
              else
                minor=0
                patch=1
              fi
              ;;
            minor)
              if [ -n "$latest_tag" ]; then
                minor=$(echo "$latest_tag" | cut -d'.' -f2)
                minor=$((minor + 1))
              else
                minor=1
              fi
              patch=0
              ;;
            major)
              if [ -n "$latest_tag" ] && [ "$IS_PUSH_TRIGGER" != "true" ]; then
                echo "::error::Release line v${RELEASE_LINE} already exists; use patch or minor"
                exit 1
              fi
              minor=0
              patch=0
              ;;
            *)
              echo "::error::release_type must be patch, minor, or major"
              exit 1
              ;;
          esac

          new_tag="v${major}.${minor}.${patch}"

          timestamp=$(date -u +"%Y%m%d-%H%M%S")
          deploy_tag="${new_tag}-${timestamp}"

          echo "Previous release tag: ${latest_tag:-none}"
          echo "Computed release tag: $new_tag"
          echo "Computed deploy tag:  $deploy_tag"

          echo "previous_tag=${latest_tag}" >> "$GITHUB_OUTPUT"
          echo "new_tag=${new_tag}" >> "$GITHUB_OUTPUT"
          echo "deploy_tag=${deploy_tag}" >> "$GITHUB_OUTPUT"
          echo "major_tag=v${major}" >> "$GITHUB_OUTPUT"

      - name: Push docker image to GAR
        id: docker_build_push
        uses: nais/docker-build-push@8e41f1f58749b9248e376c25d33bfbdd2b1163c0 # ratchet:nais/docker-build-push@v0
        with:
          team: nais-verification
          tag: ${{ steps.tags.outputs.deploy_tag }}
          salsa: 'false'
          docker_context: 'test'

      - name: Attest and sign test image
        uses: './'
        with:
          image_ref: ${{ steps.docker_build_push.outputs.image }}

      - name: Deploy attest-sign-integration-test to NAIS
        uses: nais/deploy/actions/deploy@027a91857992525139798892f2804b0ca21f4af6 # ratchet:nais/deploy/actions/deploy@v2
        env:
          CLUSTER: dev-gcp
          RESOURCE: test/nais.yml
          VAR: image=${{ steps.docker_build_push.outputs.image }},name=attest-sign-integration-test

      - name: Publish release and update floating major tag
        if: ${{ success() && (inputs.dry_run || 'true') == 'false' && steps.reconcile.outputs.repaired != 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_TAG: ${{ steps.tags.outputs.new_tag }}
          PREVIOUS_TAG: ${{ steps.tags.outputs.previous_tag }}
          MAJOR_TAG: ${{ steps.tags.outputs.major_tag }}
        run: |
          set -e
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git fetch --tags --force

          notes_args=()
          if [ -n "$PREVIOUS_TAG" ]; then
            notes_args+=(--notes-start-tag "$PREVIOUS_TAG")
          fi
          gh release create "$NEW_TAG" \
            --target "$GITHUB_SHA" \
            --title "$NEW_TAG" \
            --generate-notes \
            "${notes_args[@]}"

          echo "Updating floating tag '$MAJOR_TAG' to $NEW_TAG"
          git tag -f "$MAJOR_TAG" "$GITHUB_SHA"
          git push origin -f "$MAJOR_TAG"
