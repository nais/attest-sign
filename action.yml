name: 'attest-sign'
description: 'Generate SBOM, attest and sign docker image'
branding:
  icon: 'lock'
  color: 'green'
inputs:
  image_ref:
    description: |
      'form <image>@<digest>'
      'image ref, i.e. "europe-north1-docker.pkg.dev/nais-io/nais/images/canary-deployer@sha256:eac1f85bee008dfe4ca0eadd1f32256946a171b445d129dba8f00cc67d43582b"'
    required: true
  sbom:
    description: 'existing SBOM in cyclonedx format'
    default: 'auto-generate-for-me-please.json'
  additional_sboms:
    description: 'newline-separated list of extra CycloneDX SBOM files to merge with the primary SBOM'
    default: ''
  trivy_java_db_repositories:
    description: 'specify the --java-db-repository strings for Trivy'
    default: "europe-north1-docker.pkg.dev/nais-io/github-ptc/aquasecurity/trivy-java-db:1,public.ecr.aws/aquasecurity/trivy-java-db,ghcr.io/aquasecurity/trivy-java-db:1"
outputs:
  sbom:
    description: 'SBOM.json in cyclonedx format'
    value: ${{ steps.set-outputs.outputs.SBOM }}
runs:
  using: 'composite'
  steps:
    - name: 'Validate image ref'
      env:
        IMAGE_REF: ${{ inputs.image_ref }}
      run: |
        image_ref="${IMAGE_REF}"
        if [[ $image_ref != *@sha256:* ]]; then
          echo "Image must be in the form of <image>@<digest>"
          exit 1
        fi
      shell: 'bash'
    - name: 'Install cosign'
      uses: 'sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6' # ratchet:sigstore/cosign-installer@v4.1.2
      with:
        cosign-release: 'v3.0.6'

    # Check if the 'sbom' input is provided, and output a message if it is empty
    - name: "Validate SBOM input"
      env:
        SBOM: ${{ inputs.sbom }}
      shell: 'bash'
      run: |
        sbom="${SBOM}"
        if [ -z "$sbom" ]; then
          echo "SBOM input is empty. Please provide a valid SBOM for attestation."
          exit 1
        elif [[ ! $sbom =~ ^[a-zA-Z0-9._/-]+$ ]]; then
          echo "Invalid SBOM filename or path: $sbom"
          exit 1
        else
          echo "SBOM input is provided and valid: $sbom"
        fi

    - name: 'Validate additional SBOM inputs'
      env:
        ADDITIONAL_SBOMS: ${{ inputs.additional_sboms }}
      shell: 'bash'
      run: |
        while IFS= read -r sbom; do
          [ -z "$sbom" ] && continue

          if [[ ! $sbom =~ ^[a-zA-Z0-9._/-]+$ ]]; then
            echo "Invalid SBOM filename or path: $sbom"
            exit 1
          fi

          if [ ! -f "$sbom" ]; then
            echo "SBOM file does not exist: $sbom"
            exit 1
          fi

          echo "Additional SBOM input is provided and valid: $sbom"
        done <<EOF
        ${ADDITIONAL_SBOMS}
        EOF

    - uses: oras-project/setup-oras@38de303aac69abb66f3e6255b7198bff35f323e3 # ratchet:oras-project/setup-oras@v2.0.0
      name: Setup ORAS for manifest fetch

    - name: Fetch Trivy Java DB digest
      shell: 'bash'
      id: fetch-trivy-java-db-digest
      run: |
        TRIVY_JAVA_DB_DIGEST=$(oras manifest fetch europe-north1-docker.pkg.dev/nais-io/remote-ghcr/aquasecurity/trivy-java-db:1 | jq -r '.layers[0].digest')
        echo "TRIVY_JAVA_DB_DIGEST=$TRIVY_JAVA_DB_DIGEST" >> $GITHUB_OUTPUT

    - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # ratchet:actions/cache@v5
      id: cache-trivy-java-db
      with:
        path: .trivy
        key: trivy-db-${{ steps.fetch-trivy-java-db-digest.outputs.TRIVY_JAVA_DB_DIGEST }}

    - name: 'Generate SBOM'
      if: inputs.sbom == 'auto-generate-for-me-please.json'
      uses: 'aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25' # ratchet:aquasecurity/trivy-action@v0.36.0
      env:
        TRIVY_SKIP_DB_UPDATE: "true"
        TRIVY_JAVA_DB_REPOSITORY: "${{ inputs.trivy_java_db_repositories }}"
      with:
        scan-type: 'image'
        format: 'cyclonedx'
        output: 'auto-generate-for-me-please.json'
        image-ref: "${{ inputs.image_ref }}"
        cache-dir: ".trivy"
        # Pin version to avoid unexpected issues with new releases
        version: "v0.70.0"

        # See https://github.com/yogeshlonkar/trivy-cache-action?tab=readme-ov-file#trivy-cache-action-
    - name: Fix .trivy permissions
      shell: 'bash'
      run: |
        if [ -d ".trivy" ]; then
          sudo chown -R $(stat . -c %u:%g) .trivy
        else
          echo ".trivy directory does not exist, skipping chown."
        fi

    - name: Install cyclonedx-cli
      if: inputs.additional_sboms != ''
      shell: 'bash'
      run: |
        set -e

        version='v0.32.0'
        download_url='https://github.com/CycloneDX/cyclonedx-cli/releases/download/v0.32.0/cyclonedx-linux-x64'
        expected_sha='454879e6a4a405c8a13bff49b8982adcb0596f3019b26b0811c66e4d7f0783e1'

        curl -fsSL "$download_url" -o cyclonedx
        echo "$expected_sha  cyclonedx" | sha256sum --check --status
        chmod +x cyclonedx
        sudo mv cyclonedx /usr/local/bin/cyclonedx

    - name: Prepare final SBOM
      id: prepare-sbom
      env:
        SBOM: ${{ inputs.sbom }}
        ADDITIONAL_SBOMS: ${{ inputs.additional_sboms }}
      shell: 'bash'
      run: |
        set -e

        if [ "$SBOM" = "auto-generate-for-me-please.json" ]; then
          primary_sbom='auto-generate-for-me-please.json'
        else
          primary_sbom="$SBOM"
        fi

        final_sbom="$primary_sbom"
        merged_sbom='merged-sbom.json'
        sboms=("$primary_sbom")

        while IFS= read -r sbom; do
          [ -z "$sbom" ] && continue
          sboms+=("$sbom")
        done <<EOF
        ${ADDITIONAL_SBOMS}
        EOF

        if [ "${#sboms[@]}" -gt 1 ]; then
          cyclonedx merge --input-files "${sboms[@]}" --output-file "$merged_sbom" --output-format json
          final_sbom="$merged_sbom"
        fi

        echo "final_sbom=$final_sbom" >> "$GITHUB_OUTPUT"

    - name: Debug SBOM summary
      shell: bash
      run: |
        sbom='${{ steps.prepare-sbom.outputs.final_sbom }}'

        echo "=== SBOM file info ==="
        ls -lh "$sbom"

        echo "=== CycloneDX metadata ==="
        jq '{bomFormat, specVersion, metadata: {timestamp, tools}}' "$sbom"

        echo "=== Component count ==="
        jq '.components | length' "$sbom"

        echo "=== First 2 components ==="
        jq '.components[:2]' "$sbom"

    - name: 'Sign and attest image'
      env:
        IMAGE_REF: ${{ inputs.image_ref }}
        FINAL_SBOM: ${{ steps.prepare-sbom.outputs.final_sbom }}
      shell: 'bash'
      run: |
        image_ref="${IMAGE_REF}"

        sbom="${FINAL_SBOM}"

        echo "Using SBOM file: $sbom" 

        cosign version
        cosign sign --yes "${image_ref}"
        cosign attest --yes --predicate "$sbom" --type cyclonedx  "${image_ref}"


    - name: Set outputs
      shell: bash
      id: set-outputs
      run: |
        sbom='${{ steps.prepare-sbom.outputs.final_sbom }}'
        echo "SBOM=$sbom" >> $GITHUB_OUTPUT
