name: CI for Attest Sign

on:
  push:
    branches:
      - '**'

concurrency:
  group: attest-sign-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build image and run action
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      image_ref: ${{ steps.image_ref.outputs.image_ref }}
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1

      - name: Compute CI image tag
        id: tags
        env:
          REF_NAME: ${{ github.head_ref || github.ref_name }}
        run: |
          set -e

          safe_ref=$(printf '%s' "$REF_NAME" | tr '/[:upper:]' '-[:lower:]' | tr -cd 'a-z0-9._-')
          image_tag="ci-${safe_ref}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          echo "image_tag=${image_tag}" >> "$GITHUB_OUTPUT"

      - name: Push docker image to GAR
        id: docker_build_push
        uses: nais/docker-build-push@dd7421d5068057a020ca46ead966c26190c516b1 # ratchet:nais/docker-build-push@v0
        with:
          team: nais-verification
          tag: ${{ steps.tags.outputs.image_tag }}
          salsa: 'false'
          docker_context: 'test'

      - name: Attest and sign test image
        id: attest_sign
        uses: './'
        with:
          image_ref: ${{ steps.docker_build_push.outputs.image }}
          sbom: auto-generate-for-me-please.json
          additional_sboms: |
            test/npm-sbom.json
          sbom_check: error

      - name: Verify merged SBOM output
        env:
          FINAL_SBOM: ${{ steps.attest_sign.outputs.sbom }}
        run: |
          set -e

          sbom="$FINAL_SBOM"
          test -f "$sbom"

          test "$(jq -r '.specVersion' "$sbom")" = "1.7"
          jq -e '.components[] | select(.name == "npm-lib" and .version == "1.2.3")' "$sbom" >/dev/null

          component_count=$(jq '.components | length' "$sbom")
          if [ "$component_count" -le 1 ]; then
            echo "Expected merged SBOM to contain both image and npm components, got $component_count component(s)."
            exit 1
          fi

          dup_bom_refs=$(jq '[.components[]."bom-ref" | select(. != null)] | group_by(.) | map(select(length > 1)) | length' "$sbom")
          if [ "$dup_bom_refs" -ne 0 ]; then
            echo "Final SBOM contains duplicate bom-ref values; normalization did not run."
            exit 1
          fi

      - name: Export image ref
        id: image_ref
        run: |
          echo "image_ref=${{ steps.docker_build_push.outputs.image }}" >> "$GITHUB_OUTPUT"

  sbom-scripts:
    name: SBOM normalize + lint scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1

      - name: Install cyclonedx-cli
        run: bash scripts/install-cyclonedx-cli.sh

      - name: normalize-sbom.sh
        run: bash test/normalize-sbom-test.sh

      - name: lint-sbom.sh
        run: bash test/lint-sbom-test.sh

  trivy-install:
    name: Trivy cold installation
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1

      - name: install-trivy.sh tests
        run: bash test/install-trivy-test.sh

      - name: Install Trivy
        run: bash scripts/install-trivy.sh

      - name: Verify version and generate SBOM
        run: |
          set -euo pipefail
          source scripts/trivy-release.sh
          trivy --version | grep -Fx "Version: ${TRIVY_VERSION#v}"
          docker build -t attest-sign-trivy-test test
          docker save attest-sign-trivy-test -o "$RUNNER_TEMP/image.tar"
          trivy image --input "$RUNNER_TEMP/image.tar" --skip-db-update \
            --format cyclonedx --output "$RUNNER_TEMP/sbom.json"
          jq -e '.bomFormat == "CycloneDX" and (.components | length > 0)' "$RUNNER_TEMP/sbom.json"

  deploy-preview:
    name: Deploy preview job to dev
    if: ${{ github.event_name == 'push' && github.ref != 'refs/heads/main' }}
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1

      - name: Compute preview job name
        id: preview
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -e

          safe_ref=$(printf '%s' "$REF_NAME" | tr '/[:upper:]' '-[:lower:]' | tr -cd 'a-z0-9-')
          safe_ref=${safe_ref#-}
          safe_ref=${safe_ref%-}
          safe_ref=${safe_ref:0:35}
          name="attest-sign-${safe_ref}-it"

          echo "name=${name}" >> "$GITHUB_OUTPUT"

      - name: Deploy preview to NAIS
        uses: nais/deploy/actions/deploy@033f70f2484ddfa91dc3d878e06ced3113f996ad # ratchet:nais/deploy/actions/deploy@v3
        env:
          CLUSTER: dev-gcp
          RESOURCE: test/nais.yml
          VAR: image=${{ needs.validate.outputs.image_ref }},name=${{ steps.preview.outputs.name }}
